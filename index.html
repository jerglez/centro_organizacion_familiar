<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centro de Organización Familiar</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #0E5C56;
    --teal-oscuro: #093F3B;
    --teal-claro: #E4EFEE;
    --verde: #2E9F6E;
    --verde-fondo: #E9F6EF;
    --coral: #C85A46;
    --coral-fondo: #FBEBE7;
    --mango: #D99A3E;
    --fondo: #F6F9F8;
    --superficie: #FFFFFF;
    --texto: #1C2521;
    --texto-secundario: #5C6864;
    --borde: #DCE5E2;

    /* alias de compatibilidad con nombres usados antes en el archivo */
    --azul: var(--teal);
    --azul-oscuro: var(--teal-oscuro);
    --rojo: var(--coral);
    --rojo-fondo: var(--coral-fondo);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--fondo);
    color: var(--texto);
    min-height: 100vh;
    padding: 1.25rem;
  }
  .cifra {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Pantalla de login ---------- */
  #login-screen {
    max-width: 380px;
    margin: 4rem auto 0;
    background: var(--superficie);
    border-radius: 16px;
    border: 1px solid var(--borde);
    padding: 2rem 1.75rem;
    text-align: center;
  }
  #login-screen h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.5rem; margin: 0 0 0.4rem; color: var(--teal-oscuro); }
  #login-screen p { color: var(--texto-secundario); font-size: 0.9rem; margin: 0 0 1.5rem; }
  .g_id_signin { display: flex; justify-content: center; }

  #login-error {
    display: none;
    background: var(--rojo-fondo);
    color: var(--rojo);
    font-size: 0.82rem;
    padding: 0.6rem 0.8rem;
    border-radius: 8px;
    margin-bottom: 1.25rem;
    text-align: left;
  }

  /* ---------- Pantalla de carga / verificacion ---------- */
  #loading-screen {
    display: none;
    max-width: 380px;
    margin: 6rem auto 0;
    text-align: center;
    color: var(--texto-secundario);
    font-size: 0.9rem;
  }
  .spinner {
    width: 34px;
    height: 34px;
    margin: 0 auto 1rem;
    border: 3px solid var(--borde);
    border-top-color: var(--azul);
    border-radius: 50%;
    animation: girar 0.8s linear infinite;
  }
  @keyframes girar { to { transform: rotate(360deg); } }

  /* ---------- Pantalla principal ---------- */
  #app-screen { display: none; max-width: 720px; margin: 0 auto; }

  header.app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.6rem;
    margin-bottom: 1.25rem;
  }
  header.app-header h2 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.2rem; margin: 0; }
  header.app-header .rol {
    display: inline-block;
    background: var(--teal-claro);
    color: var(--teal);
    font-size: 0.72rem;
    font-weight: 600;
    padding: 2px 9px;
    border-radius: 999px;
    margin-left: 8px;
  }
  .acciones-header {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .texto-sync {
    font-size: 0.72rem;
    color: var(--texto-secundario);
    white-space: nowrap;
  }
  button.secundario {
    background: none;
    border: 1px solid var(--borde);
    color: var(--texto-secundario);
    padding: 0.45rem 0.85rem;
    border-radius: 8px;
    font-size: 0.82rem;
    cursor: pointer;
  }

  /* ---------- Tarjetas resumen ---------- */
  .resumen {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }
  .resumen .tarjeta {
    background: var(--superficie);
    border: 1px solid var(--borde);
    border-radius: 12px;
    padding: 0.9rem 1rem;
  }
  .resumen .tarjeta span.label { font-size: 0.72rem; color: var(--texto-secundario); display: block; margin-bottom: 4px; }
  .resumen .tarjeta span.valor {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 1.05rem;
    font-weight: 600;
  }
  .resumen .tarjeta.saldo span.valor {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.5rem;
    color: var(--teal-oscuro);
  }
  .resumen .tarjeta.ingresos span.valor { color: var(--verde); }
  .resumen .tarjeta.gastos span.valor { color: var(--rojo); }

  /* ---------- Formulario ---------- */
  section.bloque {
    background: var(--superficie);
    border: 1px solid var(--borde);
    border-radius: 14px;
    padding: 1.25rem;
    margin-bottom: 1.25rem;
  }
  section.bloque h3 { margin: 0 0 1rem; font-size: 0.95rem; color: var(--azul-oscuro); }

  form#form-transaccion,
  form#form-categoria { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  form#form-transaccion .campo-ancho,
  form#form-categoria .campo-ancho { grid-column: 1 / -1; }
  form#form-transaccion label,
  form#form-categoria label {
    display: block;
    font-size: 0.78rem;
    color: var(--texto-secundario);
    margin-bottom: 4px;
  }
  form#form-transaccion input,
  form#form-transaccion select,
  form#form-categoria input,
  form#form-categoria select {
    width: 100%;
    padding: 0.55rem 0.6rem;
    border-radius: 8px;
    border: 1px solid var(--borde);
    font-size: 0.9rem;
    font-family: inherit;
  }
  .tipo-toggle { display: flex; gap: 0.5rem; }
  .tipo-toggle button {
    flex: 1;
    padding: 0.55rem;
    border-radius: 8px;
    border: 1px solid var(--borde);
    background: var(--superficie);
    font-size: 0.85rem;
    cursor: pointer;
    color: var(--texto-secundario);
  }
  .tipo-toggle button.activo.ingreso { background: var(--verde-fondo); border-color: var(--verde); color: var(--verde); }
  .tipo-toggle button.activo.gasto { background: var(--rojo-fondo); border-color: var(--rojo); color: var(--rojo); }

  button.guardar {
    grid-column: 1 / -1;
    background: var(--azul);
    color: #fff;
    border: none;
    padding: 0.7rem;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 0.25rem;
  }
  button.guardar:disabled { opacity: 0.6; cursor: not-allowed; }

  /* ---------- Lista de transacciones ---------- */
  ul#lista-transacciones,
  #lista-categorias { list-style: none; margin: 0; padding: 0; }
  ul#lista-transacciones li,
  #lista-categorias li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.65rem 0 0.65rem 0.7rem;
    border-bottom: 1px solid var(--borde);
    border-left: 3px solid transparent;
  }
  ul#lista-transacciones li.ingreso,
  #lista-categorias li.ingreso { border-left-color: var(--verde); }
  ul#lista-transacciones li.gasto,
  #lista-categorias li.gasto { border-left-color: var(--coral); }
  ul#lista-transacciones li:last-child,
  #lista-categorias li:last-child { border-bottom: none; }
  .item-info { min-width: 0; flex: 1; margin-right: 0.5rem; }
  .item-info .categoria { font-size: 0.9rem; font-weight: 600; word-break: break-word; }
  .item-info .detalle { font-size: 0.76rem; color: var(--texto-secundario); word-break: break-word; }
  .item-monto { font-weight: 700; font-size: 0.95rem; white-space: nowrap; }
  .item-monto.ingreso { color: var(--verde); }
  .item-monto.gasto { color: var(--rojo); }

  #mensaje-estado {
    font-size: 0.82rem;
    padding: 0.6rem 0.8rem;
    border-radius: 8px;
    margin-bottom: 1rem;
    display: none;
  }
  #mensaje-estado.error { display: block; color: var(--rojo); background: var(--rojo-fondo); }
  #mensaje-estado.ok { display: block; color: var(--verde); background: var(--verde-fondo); }
  .vacio { color: var(--texto-secundario); font-size: 0.85rem; text-align: center; padding: 1rem 0; }

  /* ---------- Pie de version ---------- */
  footer#pie-version {
    text-align: center;
    color: var(--texto-secundario);
    font-size: 0.72rem;
    margin-top: 2rem;
    padding-bottom: 1rem;
  }

  /* ---------- Ajustes para pantallas de celular ---------- */
  @media (max-width: 480px) {
    body { padding: 0.75rem; }

    #login-screen { margin-top: 2.5rem; padding: 1.5rem 1.25rem; }

    header.app-header { flex-direction: column; align-items: flex-start; }
    .acciones-header { width: 100%; justify-content: space-between; }

    .resumen { gap: 0.5rem; }
    .resumen .tarjeta { padding: 0.65rem 0.7rem; }
    .resumen .tarjeta span.valor { font-size: 1rem; }
    .resumen .tarjeta span.label { font-size: 0.66rem; }

    section.bloque { padding: 1rem; }
    form#form-transaccion,
    form#form-categoria { grid-template-columns: 1fr; }

    .tipo-toggle { flex-wrap: nowrap; }

    ul#lista-transacciones li,
    #lista-categorias li {
      align-items: flex-start;
    }
  }
</style>
</head>
<body>

<div id="login-screen">
  <h1>Centro de Organización Familiar</h1>
  <p>Inicia sesión con tu cuenta de Google para continuar</p>
  <div id="login-error"></div>
  <div id="g_id_onload"
       data-client_id="875219439176-7tdu1a1rh0goe8qm8hjits1iumhkd06b.apps.googleusercontent.com"
       data-callback="manejarLogin">
  </div>
  <div class="g_id_signin" data-type="standard" data-theme="outline" data-size="large"></div>
</div>

<div id="loading-screen">
  <div class="spinner"></div>
  <p>Verificando acceso...</p>
</div>

<div id="app-screen">
  <header class="app-header">
    <h2>Hola, <span id="nombre-usuario"></span><span class="rol" id="rol"></span></h2>
    <div class="acciones-header">
      <span id="ultima-sync" class="texto-sync"></span>
      <button class="secundario" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
  </header>

  <div id="mensaje-estado"></div>

  <div class="resumen">
    <div class="tarjeta saldo">
      <span class="label">Saldo total</span>
      <span class="valor" id="valor-saldo">RD$0</span>
    </div>
    <div class="tarjeta ingresos">
      <span class="label">Ingresos · este mes</span>
      <span class="valor" id="valor-ingresos">RD$0</span>
    </div>
    <div class="tarjeta gastos">
      <span class="label">Gastos · este mes</span>
      <span class="valor" id="valor-gastos">RD$0</span>
    </div>
  </div>

  <section class="bloque">
    <h3>Registrar movimiento</h3>
    <form id="form-transaccion" onsubmit="return agregarTransaccion(event)">
      <div class="campo-ancho tipo-toggle">
        <button type="button" id="btn-ingreso" class="activo ingreso" onclick="elegirTipo('ingreso')">Ingreso</button>
        <button type="button" id="btn-gasto" class="gasto" onclick="elegirTipo('gasto')">Gasto</button>
      </div>
      <input type="hidden" id="campo-tipo" value="ingreso">

      <div>
        <label for="campo-monto">Monto (RD$)</label>
        <input type="number" id="campo-monto" step="0.01" min="0" required>
      </div>
      <div>
        <label for="campo-categoria">Categoría</label>
        <select id="campo-categoria" required></select>
      </div>
      <div class="campo-ancho">
        <label for="campo-descripcion">Descripción (opcional)</label>
        <input type="text" id="campo-descripcion" placeholder="Ej. Compra semanal">
      </div>
      <div class="campo-ancho">
        <label for="campo-comercio">Comercio (opcional)</label>
        <input type="text" id="campo-comercio" placeholder="Ej. Supermercado Nacional">
      </div>

      <button type="submit" class="guardar" id="btn-guardar">Guardar</button>
    </form>
  </section>

  <section class="bloque">
    <h3>Movimientos recientes</h3>
    <ul id="lista-transacciones">
      <li class="vacio">Cargando...</li>
    </ul>
  </section>

  <section class="bloque">
    <h3>Categorías</h3>
    <form id="form-categoria" onsubmit="return guardarCategoria(event)">
      <div class="campo-ancho tipo-toggle">
        <button type="button" id="cat-btn-ingreso" class="activo ingreso" onclick="elegirTipoCategoria('ingreso')">Ingreso</button>
        <button type="button" id="cat-btn-gasto" class="gasto" onclick="elegirTipoCategoria('gasto')">Gasto</button>
      </div>
      <input type="hidden" id="cat-campo-tipo" value="ingreso">
      <input type="hidden" id="cat-campo-id" value="">

      <div>
        <label for="cat-campo-nombre">Nombre</label>
        <input type="text" id="cat-campo-nombre" required>
      </div>
      <div>
        <label for="cat-campo-icono">Ícono (opcional)</label>
        <input type="text" id="cat-campo-icono" maxlength="4" placeholder="🛒">
      </div>

      <div class="campo-ancho" style="display:flex; gap:0.5rem;">
        <button type="submit" class="guardar" id="cat-btn-guardar" style="flex:1;">Agregar categoría</button>
        <button type="button" class="secundario" id="cat-btn-cancelar" onclick="cancelarEdicionCategoria()" style="display:none;">Cancelar</button>
      </div>
    </form>

    <ul id="lista-categorias" style="margin-top:1rem;">
      <li class="vacio">Cargando...</li>
    </ul>
  </section>
</div>

<footer id="pie-version"></footer>

<script>
  // Pega aqui la URL /exec que copiaste al publicar tu Apps Script
  const API_URL = "https://script.google.com/macros/s/AKfycbww_S9sv0fB25uOmr9AH4A_u0pF469L1LWPVRJBTo_H-eRZRanMLiNHJHZyqeMxfNmNsw/exec";

  // Actualiza estos dos valores cada vez que subas una nueva version del HTML
  const VERSION_APP = "2.0";
  const FECHA_ULTIMA_ACTUALIZACION = "29 jul 2026, 3:15 pm (GMT-4, hora Santo Domingo)";

  document.getElementById('pie-version').textContent =
    "Versión " + VERSION_APP + " · Última actualización: " + FECHA_ULTIMA_ACTUALIZACION;

  let tokenActual = null;
  let categoriasCache = [];
  let tipoSeleccionado = "ingreso";
  let intervaloSincronizacion = null;

  function manejarLogin(response) {
    tokenActual = response.credential;
    document.getElementById('login-error').style.display = 'none';
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('loading-screen').style.display = 'block';
    verificarAcceso();
  }

  function mostrarErrorLogin(texto) {
    tokenActual = null;
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('login-screen').style.display = 'block';
    const errEl = document.getElementById('login-error');
    errEl.textContent = texto;
    errEl.style.display = 'block';
  }

  async function verificarAcceso() {
    try {
      const datosUsuario = await llamarAPI('getUsuarioActual');
      if (!datosUsuario.ok) {
        mostrarErrorLogin(datosUsuario.error || 'No tienes acceso autorizado. Intenta con otra cuenta.');
        return;
      }
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('app-screen').style.display = 'block';
      document.getElementById('nombre-usuario').textContent = datosUsuario.datos.nombre;
      document.getElementById('rol').textContent = datosUsuario.datos.rol;

      await sincronizarDatos();
      if (intervaloSincronizacion) clearInterval(intervaloSincronizacion);
      intervaloSincronizacion = setInterval(sincronizarDatos, 10000); // cada 10 segundos
    } catch (err) {
      mostrarErrorLogin('No se pudo conectar con la API: ' + err.message);
    }
  }

  // Formatea la hora actual en el huso horario de Santo Domingo (GMT-4, sin horario de verano)
  function horaSantoDomingo(fecha) {
    return fecha.toLocaleTimeString('es-DO', {
      timeZone: 'America/Santo_Domingo',
      hour: '2-digit',
      minute: '2-digit'
    });
  }

  function actualizarUltimaSincronizacion() {
    document.getElementById('ultima-sync').textContent =
      'Última sincronización: ' + horaSantoDomingo(new Date());
  }

  async function sincronizarDatos() {
    // No interrumpir si el usuario esta escribiendo/seleccionando algo en los formularios
    const elementoActivo = document.activeElement;
    const escribiendoEnFormulario = elementoActivo && (
      elementoActivo.closest('#form-transaccion') || elementoActivo.closest('#form-categoria')
    ) && (elementoActivo.tagName === 'INPUT' || elementoActivo.tagName === 'SELECT');

    if (escribiendoEnFormulario) return;

    await cargarCategorias();
    await cargarTransacciones();
    actualizarUltimaSincronizacion();
  }

  async function llamarAPI(accion, payload) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ accion: accion, token: tokenActual, payload: payload || {} })
    });
    return res.json();
  }

  function mostrarMensaje(texto, tipo) {
    const el = document.getElementById('mensaje-estado');
    el.textContent = texto;
    el.className = tipo;
    if (tipo === 'ok') {
      setTimeout(() => { el.className = ''; el.textContent = ''; }, 3000);
    }
  }

  function elegirTipo(tipo) {
    tipoSeleccionado = tipo;
    document.getElementById('campo-tipo').value = tipo;
    document.getElementById('btn-ingreso').classList.toggle('activo', tipo === 'ingreso');
    document.getElementById('btn-gasto').classList.toggle('activo', tipo === 'gasto');
    poblarSelectCategorias();
  }

  async function cargarCategorias() {
    const resp = await llamarAPI('getCategorias');
    if (resp.ok) {
      categoriasCache = resp.datos;
      poblarSelectCategorias();
      renderizarCategorias();
    }
  }

  function poblarSelectCategorias() {
    const select = document.getElementById('campo-categoria');
    const valorPrevio = select.value; // recordar que tenia seleccionado antes de reconstruir
    select.innerHTML = '';
    const filtradas = categoriasCache.filter(c => c['Tipo (ingreso/gasto)'] === tipoSeleccionado);
    if (filtradas.length === 0) {
      const opt = document.createElement('option');
      opt.textContent = 'Sin categorías disponibles';
      select.appendChild(opt);
      return;
    }
    filtradas.forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat['Nombre'];
      opt.textContent = cat['Nombre'];
      select.appendChild(opt);
    });
    // Restaurar la seleccion anterior si esa categoria sigue existiendo
    if (valorPrevio && filtradas.some(c => c['Nombre'] === valorPrevio)) {
      select.value = valorPrevio;
    }
  }

  // ---------- Categorías editables ----------
  let tipoCategoriaSeleccionado = "ingreso";
  let categoriaEditandoId = null;

  function elegirTipoCategoria(tipo) {
    tipoCategoriaSeleccionado = tipo;
    document.getElementById('cat-campo-tipo').value = tipo;
    document.getElementById('cat-btn-ingreso').classList.toggle('activo', tipo === 'ingreso');
    document.getElementById('cat-btn-gasto').classList.toggle('activo', tipo === 'gasto');
  }

  function renderizarCategorias() {
    const lista = document.getElementById('lista-categorias');
    lista.innerHTML = '';
    if (categoriasCache.length === 0) {
      lista.innerHTML = '<li class="vacio">No hay categorías creadas</li>';
      return;
    }
    categoriasCache.forEach(cat => {
      const tipo = cat['Tipo (ingreso/gasto)'];
      const li = document.createElement('li');
      li.className = tipo;
      li.innerHTML = `
        <div class="item-info">
          <div class="categoria">${cat['Icono'] || ''} ${cat['Nombre']}</div>
          <div class="detalle">${tipo === 'ingreso' ? 'Ingreso' : 'Gasto'}</div>
        </div>
        <div style="display:flex; gap:6px;">
          <button type="button" class="secundario" onclick="editarCategoria('${cat['ID']}')">Editar</button>
          <button type="button" class="secundario" onclick="eliminarCategoria('${cat['ID']}')">Eliminar</button>
        </div>
      `;
      lista.appendChild(li);
    });
  }

  function editarCategoria(id) {
    const cat = categoriasCache.find(c => String(c['ID']) === String(id));
    if (!cat) return;
    categoriaEditandoId = id;
    document.getElementById('cat-campo-id').value = id;
    document.getElementById('cat-campo-nombre').value = cat['Nombre'];
    document.getElementById('cat-campo-icono').value = cat['Icono'] || '';
    elegirTipoCategoria(cat['Tipo (ingreso/gasto)']);
    document.getElementById('cat-btn-guardar').textContent = 'Guardar cambios';
    document.getElementById('cat-btn-cancelar').style.display = 'inline-block';
    document.getElementById('form-categoria').scrollIntoView({ behavior: 'smooth' });
  }

  function cancelarEdicionCategoria() {
    categoriaEditandoId = null;
    document.getElementById('form-categoria').reset();
    document.getElementById('cat-campo-id').value = '';
    elegirTipoCategoria('ingreso');
    document.getElementById('cat-btn-guardar').textContent = 'Agregar categoría';
    document.getElementById('cat-btn-cancelar').style.display = 'none';
  }

  async function eliminarCategoria(id) {
    if (!confirm('¿Eliminar esta categoría? Las transacciones ya guardadas no se verán afectadas.')) return;
    try {
      const resp = await llamarAPI('deleteCategoria', { id: id });
      if (resp.ok) {
        mostrarMensaje('Categoría eliminada', 'ok');
        await cargarCategorias();
        actualizarUltimaSincronizacion();
      } else {
        mostrarMensaje('Error al eliminar: ' + resp.error, 'error');
      }
    } catch (err) {
      mostrarMensaje('No se pudo eliminar: ' + err.message, 'error');
    }
  }

  async function guardarCategoria(evento) {
    evento.preventDefault();
    const boton = document.getElementById('cat-btn-guardar');
    boton.disabled = true;

    const payload = {
      nombre: document.getElementById('cat-campo-nombre').value.trim(),
      tipo: tipoCategoriaSeleccionado,
      icono: document.getElementById('cat-campo-icono').value.trim()
    };

    try {
      let resp;
      if (categoriaEditandoId) {
        payload.id = categoriaEditandoId;
        resp = await llamarAPI('updateCategoria', payload);
      } else {
        resp = await llamarAPI('addCategoria', payload);
      }

      if (resp.ok) {
        mostrarMensaje(categoriaEditandoId ? 'Categoría actualizada' : 'Categoría agregada', 'ok');
        cancelarEdicionCategoria();
        await cargarCategorias();
        actualizarUltimaSincronizacion();
      } else {
        mostrarMensaje('Error: ' + resp.error, 'error');
      }
    } catch (err) {
      mostrarMensaje('No se pudo guardar: ' + err.message, 'error');
    } finally {
      boton.disabled = false;
    }
    return false;
  }

  async function cargarTransacciones() {
    const lista = document.getElementById('lista-transacciones');
    const resp = await llamarAPI('getTransacciones');
    if (!resp.ok) {
      lista.innerHTML = '<li class="vacio">No se pudieron cargar los movimientos</li>';
      return;
    }

    const transacciones = (resp.datos || []).slice().reverse();

    // El Saldo es acumulado de todo el historico (el dinero no se resetea cada mes)
    let saldoTotal = 0;
    // Ingresos/Gastos del Dashboard cierran por mes actual, para reflejar el mes en curso
    let ingresosMes = 0, gastosMes = 0;

    const ahora = new Date();
    const mesActual = ahora.getMonth();
    const anioActual = ahora.getFullYear();

    lista.innerHTML = '';
    if (transacciones.length === 0) {
      lista.innerHTML = '<li class="vacio">Aún no hay movimientos registrados</li>';
    }

    transacciones.forEach(t => {
      const tipo = t['Tipo (ingreso/gasto)'];
      const monto = parseFloat(t['Monto']) || 0;
      const fechaTransaccion = t['Fecha'] ? new Date(t['Fecha']) : null;

      // Saldo: siempre acumulado, sin importar la fecha
      if (tipo === 'ingreso') saldoTotal += monto; else saldoTotal -= monto;

      // Ingresos/Gastos del Dashboard: solo si la transaccion es del mes y anio actual
      const esDelMesActual = fechaTransaccion &&
        fechaTransaccion.getMonth() === mesActual &&
        fechaTransaccion.getFullYear() === anioActual;

      if (esDelMesActual) {
        if (tipo === 'ingreso') ingresosMes += monto; else gastosMes += monto;
      }

      const li = document.createElement('li');
      li.className = tipo;
      const fecha = fechaTransaccion ? fechaTransaccion.toLocaleDateString('es-DO') : '';
      li.innerHTML = `
        <div class="item-info">
          <div class="categoria">${t['Categoria'] || 'Sin categoría'}</div>
          <div class="detalle">${t['Descripcion'] || t['Comercio'] || ''} ${fecha ? '· ' + fecha : ''}</div>
        </div>
        <div class="item-monto cifra ${tipo}">${tipo === 'ingreso' ? '+' : '-'}RD$${monto.toLocaleString('es-DO', {minimumFractionDigits:2})}</div>
      `;
      lista.appendChild(li);
    });

    document.getElementById('valor-ingresos').textContent = 'RD$' + ingresosMes.toLocaleString('es-DO', {minimumFractionDigits:2});
    document.getElementById('valor-gastos').textContent = 'RD$' + gastosMes.toLocaleString('es-DO', {minimumFractionDigits:2});
    document.getElementById('valor-saldo').textContent = 'RD$' + saldoTotal.toLocaleString('es-DO', {minimumFractionDigits:2});
  }

  async function agregarTransaccion(evento) {
    evento.preventDefault();
    const boton = document.getElementById('btn-guardar');
    boton.disabled = true;
    boton.textContent = 'Guardando...';

    const payload = {
      tipo: tipoSeleccionado,
      monto: parseFloat(document.getElementById('campo-monto').value),
      categoria: document.getElementById('campo-categoria').value,
      descripcion: document.getElementById('campo-descripcion').value,
      comercio: document.getElementById('campo-comercio').value,
      fuente: 'manual'
    };

    try {
      const resp = await llamarAPI('addTransaccion', payload);
      if (resp.ok) {
        mostrarMensaje('Movimiento guardado correctamente', 'ok');
        document.getElementById('form-transaccion').reset();
        elegirTipo('ingreso');
        await cargarTransacciones();
        actualizarUltimaSincronizacion();
      } else {
        mostrarMensaje('Error al guardar: ' + resp.error, 'error');
      }
    } catch (err) {
      mostrarMensaje('No se pudo guardar: ' + err.message, 'error');
    } finally {
      boton.disabled = false;
      boton.textContent = 'Guardar';
    }
    return false;
  }

  function cerrarSesion() {
    tokenActual = null;
    if (intervaloSincronizacion) {
      clearInterval(intervaloSincronizacion);
      intervaloSincronizacion = null;
    }
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'none';
    document.getElementById('login-error').style.display = 'none';
    document.getElementById('login-screen').style.display = 'block';
  }
</script>
